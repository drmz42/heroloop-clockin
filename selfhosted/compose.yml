name: heroloop-selfhosted

x-deno-service: &deno-service
  image: denoland/deno:2.9.4@sha256:c777b4b225501a61074837e90a826a58f99124837824023cd60334b1e2374498
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  networks:
    - backend

services:
  postgres:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root-owned runtime environment}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?set a separate API database password in the root-owned runtime environment}
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD:?set a separate worker database password in the root-owned runtime environment}
      POSTGRES_PORT: "5432"
      PGPORT: "5432"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the root-owned runtime environment}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - max_connections=80
      - -c
      - shared_buffers=256MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init/zy-heroloop-auth-password.sh:/docker-entrypoint-initdb.d/zzza-heroloop-auth-password.sh:ro
      - ./postgres/init/zz-heroloop-bootstrap.sql:/docker-entrypoint-initdb.d/zz-heroloop-bootstrap.sql:ro
      - ./postgres/init/zzz-heroloop-api-password.sh:/docker-entrypoint-initdb.d/zzz-heroloop-api-password.sh:ro
      - ./postgres/init/zzzz-heroloop-worker-password.sh:/docker-entrypoint-initdb.d/zzzz-heroloop-worker-password.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1", "-p", "5432"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 20s
    cpus: 0.75
    mem_limit: 1024m
    pids_limit: 256
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  auth:
    image: supabase/gotrue:v2.189.0@sha256:385184459f57569c54c25209f51f3b2be99ddd7c4ce9e3555b5d3eea8447b7cf
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?set the environment-specific external Auth URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:?set the environment-specific site URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:?set the exact environment redirect allowlist}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_KEYS: ${JWT_KEYS:?set a JSON array containing the environment-specific asymmetric signing key}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    <<: *deno-service
    command: ["run", "--config=/app/deno.json", "--cached-only", "--allow-env=AUTH_INTERNAL_URL,PGHOST,PGPORT,PGDATABASE,PGUSER,PGPASSWORD,PGPOOL_SIZE,TESTER_CONTROLS_ENABLED", "--allow-net=0.0.0.0:8080,auth:9999,postgres:5432", "/app/api/main.ts"]
    environment:
      AUTH_INTERNAL_URL: http://auth:9999
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: heroloop_api_runtime
      PGPASSWORD: ${API_DATABASE_PASSWORD}
      PGPOOL_SIZE: "4"
      TESTER_CONTROLS_ENABLED: ${TESTER_CONTROLS_ENABLED:-false}
    volumes:
      - ./api:/app/api:ro
      - ../supabase/functions/player-sync/authority.mjs:/app/shared/authority.mjs:ro
      - ../supabase/functions/player-sync/combat-step.mjs:/app/shared/combat-step.mjs:ro
      - ../supabase/functions/player-sync/combat-timeline.mjs:/app/shared/combat-timeline.mjs:ro
      - ../supabase/functions/player-sync/normal-combat.mjs:/app/shared/normal-combat.mjs:ro
      - ../supabase/functions/player-sync/registration.js:/app/shared/registration.js:ro
      - ../supabase/functions/player-sync/save-schema.mjs:/app/shared/save-schema.mjs:ro
      - ./deno.json:/app/deno.json:ro
      - ./deno.lock:/app/deno.lock:ro
      - ./vendor:/app/vendor:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "deno", "eval", "const r=await fetch('http://127.0.0.1:8080/internal/health');if(!r.ok)Deno.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: 0.35
    mem_limit: 256m
    pids_limit: 128

  worker:
    <<: *deno-service
    command: ["run", "--config=/app/deno.json", "--cached-only", "--allow-env=PGHOST,PGPORT,PGDATABASE,PGUSER,PGPASSWORD,PGPOOL_SIZE", "--allow-net=postgres:5432", "--allow-write=/tmp", "/app/worker/main.ts"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: heroloop_worker_runtime
      PGPASSWORD: ${WORKER_DATABASE_PASSWORD:?set a separate worker database password in the root-owned runtime environment}
      PGPOOL_SIZE: "2"
    volumes:
      - ./worker:/app/worker:ro
      - ./deno.json:/app/deno.json:ro
      - ./deno.lock:/app/deno.lock:ro
      - ./vendor:/app/vendor:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "deno", "eval", "const age=Date.now()-(await Deno.stat('/tmp/heroloop-worker-ready')).mtime.getTime();if(age>90000)Deno.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 0.20
    mem_limit: 192m
    pids_limit: 96

networks:
  backend:
    internal: true

volumes:
  postgres-data:
