plugins {
    id 'com.android.application'
}

// HeroLoop Seeker: a native Android shell (one full-screen WebView, no browser UI).
// versionCode, versionName and the game URL are set by scripts/build-seeker-apk.sh.
android {
    namespace 'xyz.heroloop.seeker'
    compileSdk 36

    defaultConfig {
        applicationId 'xyz.heroloop.seeker'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.2.15-lab'
        buildConfigField 'String', 'GAME_URL', '"https://seeker.heroloop.xyz/?source=android#game"'
        buildConfigField 'String', 'GAME_HOST', '"seeker.heroloop.xyz"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
